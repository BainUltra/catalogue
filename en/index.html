<script>
const N = 223;
const DIR = 'pages/';
const VER = 'v1';
let spread = 0;
let animating = false;
const imgCache = {};

function pf(n) { return DIR + 'page-' + String(n).padStart(3,'0') + '.jpg?' + VER; }

function preload(n) {
  if (n < 1 || n > N || imgCache[n]) return;
  const img = new Image(); img.src = pf(n); imgCache[n] = img;
}

function preloadRange(c) { for (let i = -6; i <= 8; i++) preload(c + i); }

function leftPageNum() { return spread * 2 + 1; }
function rightPageNum() { return spread * 2 + 2; }
function maxSpread() { return Math.ceil(N / 2) - 1; }

function render() {
  const ctr = document.getElementById('bookCtr');
  ctr.querySelectorAll('.leaf').forEach(l => l.remove());
  const lp = leftPageNum();
  const rp = rightPageNum();
  const sl = document.getElementById('staticLeft');
  sl.innerHTML = '';
  if (lp >= 1 && lp <= N) {
    const img = new Image(); img.src = pf(lp); sl.appendChild(img);
  }
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  leaf.id = 'activeLeaf';
  const front = document.createElement('div');
  front.className = 'leaf-front';
  if (rp >= 1 && rp <= N) {
    const img = new Image(); img.src = pf(rp); front.appendChild(img);
  }
  const back = document.createElement('div');
  back.className = 'leaf-back';
  const nextLp = rp + 1;
  if (nextLp >= 1 && nextLp <= N) {
    const img = new Image(); img.src = pf(nextLp); back.appendChild(img);
  }
  leaf.appendChild(front);
  leaf.appendChild(back);
  ctr.insertBefore(leaf, ctr.querySelector('.spine-shadow'));
  updateUI(lp, rp);
  preloadRange(lp);
}

function updateUI(lp, rp) {
  const clampR = Math.min(rp, N);
  const ind = document.getElementById('pgInd');
  if (rp > N) ind.innerHTML = lp + ' <span>/ ' + N + '</span>';
  else ind.innerHTML = lp + '&ndash;' + clampR + ' <span>/ ' + N + '</span>';
  const atStart = spread <= 0;
  const atEnd = spread >= maxSpread();
  document.getElementById('navL').classList.toggle('off', atStart);
  document.getElementById('navR').classList.toggle('off', atEnd);
  document.getElementById('btnPrev').classList.toggle('off', atStart);
  document.getElementById('btnNext').classList.toggle('off', atEnd);
  document.querySelectorAll('.th').forEach(t => {
    const p = +t.dataset.p;
    t.classList.toggle('active', p === lp || p === clampR);
  });
  const at = document.querySelector('.th.active');
  if (at) at.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

function flipForward() {
  if (animating || spread >= maxSpread()) return;
  animating = true;
  const ctr = document.getElementById('bookCtr');
  const leaf = document.getElementById('activeLeaf');
  const nextRp = rightPageNum() + 2;
  const underRight = document.createElement('div');
  underRight.className = 'leaf';
  underRight.style.zIndex = '0';
  underRight.style.transition = 'none';
  const uf = document.createElement('div');
  uf.className = 'leaf-front';
  if (nextRp >= 1 && nextRp <= N) {
    const img = new Image(); img.src = pf(nextRp); uf.appendChild(img);
  }
  underRight.appendChild(uf);
  const ub = document.createElement('div');
  ub.className = 'leaf-back';
  underRight.appendChild(ub);
  ctr.insertBefore(underRight, ctr.querySelector('.spine-shadow'));
  leaf.style.zIndex = '10';
  requestAnimationFrame(() => { leaf.classList.add('flipped'); });
  setTimeout(() => { spread++; render(); animating = false; }, 750);
}

function flipBackward() {
  if (animating || spread <= 0) return;
  animating = true;
  const ctr = document.getElementById('bookCtr');
  const prevRp = leftPageNum() - 1;
  const prevLp = leftPageNum() - 2;
  const sl = document.getElementById('staticLeft');
  sl.innerHTML = '';
  if (prevLp >= 1 && prevLp <= N) {
    const img = new Image(); img.src = pf(prevLp); sl.appendChild(img);
  }
  const leaf = document.createElement('div');
  leaf.className = 'leaf flipped';
  leaf.style.zIndex = '10';
  const front = document.createElement('div');
  front.className = 'leaf-front';
  if (prevRp >= 1 && prevRp <= N) {
    const img = new Image(); img.src = pf(prevRp); front.appendChild(img);
  }
  const back = document.createElement('div');
  back.className = 'leaf-back';
  const curLp = leftPageNum();
  if (curLp >= 1 && curLp <= N) {
    const img = new Image(); img.src = pf(curLp); back.appendChild(img);
  }
  leaf.appendChild(front);
  leaf.appendChild(back);
  const oldLeaf = document.getElementById('activeLeaf');
  if (oldLeaf) oldLeaf.remove();
  ctr.insertBefore(leaf, ctr.querySelector('.spine-shadow'));
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { leaf.classList.remove('flipped'); });
  });
  setTimeout(() => { spread--; render(); animating = false; }, 750);
}

function goTo(pageNum) {
  if (animating) return;
  pageNum = Math.max(1, Math.min(pageNum, N));
  const targetSpread = Math.floor((pageNum - 1) / 2);
  if (targetSpread === spread) return;
  const dist = Math.abs(targetSpread - spread);
  if (dist <= 2) {
    if (targetSpread > spread) flipForward();
    else flipBackward();
    if (dist === 2) {
      setTimeout(() => {
        if (targetSpread > spread) flipForward();
        else if (targetSpread < spread) flipBackward();
      }, 800);
    }
  } else {
    animating = true;
    const ctr = document.getElementById('bookCtr');
    const dir = targetSpread > spread ? 1 : -1;
    let flips = 0;
    const maxFlips = Math.min(3, dist);
    const speed = 180;
    function quickFlip() {
      if (flips >= maxFlips) {
        spread = targetSpread; render(); animating = false; return;
      }
      spread += dir;
      const lp = leftPageNum();
      const rp = rightPageNum();
      const sl = document.getElementById('staticLeft');
      sl.innerHTML = '';
      if (lp >= 1 && lp <= N) {
        const img = new Image(); img.src = pf(lp); sl.appendChild(img);
      }
      const qLeaf = document.createElement('div');
      qLeaf.className = 'leaf' + (dir < 0 ? ' flipped' : '');
      qLeaf.style.zIndex = String(10 + maxFlips - flips);
      qLeaf.style.transition = 'transform ' + speed + 'ms cubic-bezier(0.4, 0, 0.2, 1)';
      const qf = document.createElement('div');
      qf.className = 'leaf-front';
      if (rp >= 1 && rp <= N) {
        const img = new Image(); img.src = pf(rp); qf.appendChild(img);
      }
      const qb = document.createElement('div');
      qb.className = 'leaf-back';
      const nxt = dir > 0 ? rp + 1 : lp;
      if (nxt >= 1 && nxt <= N) {
        const img = new Image(); img.src = pf(nxt); qb.appendChild(img);
      }
      qLeaf.appendChild(qf);
      qLeaf.appendChild(qb);
      ctr.insertBefore(qLeaf, ctr.querySelector('.spine-shadow'));
      requestAnimationFrame(() => {
        if (dir > 0) qLeaf.classList.add('flipped');
        else qLeaf.classList.remove('flipped');
      });
      flips++;
      setTimeout(() => {
        qLeaf.remove();
        if (flips < maxFlips) quickFlip();
        else { spread = targetSpread; render(); animating = false; }
      }, speed + 50);
    }
    quickFlip();
  }
  document.getElementById('tocPanel').classList.remove('open');
  document.getElementById('searchPanel').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipForward(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipBackward(); }
  if (e.key === 'Home') { e.preventDefault(); goTo(1); }
  if (e.key === 'End') { e.preventDefault(); goTo(N); }
  if (e.key === 'f' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); toggleFS(); }
  if ((e.key === 'f' || e.key === 'F') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') {
    document.getElementById('tocPanel').classList.remove('open');
    document.getElementById('searchPanel').classList.remove('open');
    document.getElementById('thumbStrip').classList.remove('vis');
  }
});

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

const PAGE_RATIO = 0.7778;
let zoomLevel = 1.0;

function resizeBook() {
  const topBar = 62, bottomBar = 44, pad = 32, arrowZone = 120;
  const availH = window.innerHeight - topBar - bottomBar - pad;
  const availW = window.innerWidth - arrowZone;
  let pageH = availH;
  let pageW = pageH * PAGE_RATIO;
  let bookW = pageW * 2;
  if (bookW > availW) {
    bookW = availW;
    pageW = bookW / 2;
    pageH = pageW / PAGE_RATIO;
  }
  pageW = Math.floor(pageW * zoomLevel);
  pageH = Math.floor(pageH * zoomLevel);
  document.documentElement.style.setProperty('--page-w', pageW);
  document.documentElement.style.setProperty('--page-h', pageH);
}

function zoomIn() {
  if (zoomLevel >= 1.5) return;
  zoomLevel = Math.min(1.5, zoomLevel + 0.1);
  resizeBook();
}
function zoomOut() {
  if (zoomLevel <= 0.5) return;
  zoomLevel = Math.max(0.5, zoomLevel - 0.1);
  resizeBook();
}

function init() {
  resizeBook();
  window.addEventListener('resize', resizeBook);
  buildTOC();
  buildThumbs();
  for (let i = 1; i <= 8; i++) preload(i);
  const fill = document.getElementById('barFill');
  let p = 0;
  const iv = setInterval(() => {
    p += Math.random() * 30;
    if (p >= 100) {
      p = 100; fill.style.width = '100%'; clearInterval(iv);
      setTimeout(() => {
        document.getElementById('loader').classList.add('gone');
        setTimeout(() => document.getElementById('tocPanel').classList.add('open'), 400);
      }, 250);
    }
    else fill.style.width = p + '%';
  }, 120);
  spread = 0;
  render();
}

document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();
