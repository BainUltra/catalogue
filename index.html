<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3c54'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-family='Inter, sans-serif' font-size='52' fill='%23c8a87c' font-weight='600'%3EB%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bu-navy:#1e3c54; --bu-warm:#f7f5f2; --bu-accent:#c8a87c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { min-height:100%; background:linear-gradient(180deg,#1e3c54 0%,#2a4a64 55%,#1e3c54 100%); }
  html, body { min-height:100%; font-family:'Inter',-apple-system,sans-serif; color:#3a3a3a; overflow:hidden; }
  body { min-height:100vh; min-height:100svh; background:linear-gradient(180deg,#1e3c54 0%,#2a4a64 55%,#1e3c54 100%); display:flex; align-items:center; justify-content:center; position:relative; }
  body::before { content:''; position:absolute; width:800px; height:800px; background:radial-gradient(circle,rgba(200,168,124,0.18) 0%,transparent 60%); top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; filter:blur(40px); }
  .card { position:relative; background:rgba(255,255,255,0.96); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-radius:14px; padding:56px 64px 48px; box-shadow:0 20px 60px rgba(0,0,0,0.32),0 4px 16px rgba(0,0,0,0.16); width:460px; max-width:calc(100% - 32px); text-align:center; animation:enter 0.55s cubic-bezier(0.2,0.8,0.2,1.0); }
  @keyframes enter { from { opacity:0; transform:translateY(14px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  .card-logo { display:block; margin:0 auto 22px; height:40px; width:auto; }
  .card-eyebrow { font-size:10px; font-weight:500; color:var(--bu-accent); letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px; }
  .card-title { font-size:22px; font-weight:300; color:var(--bu-navy); line-height:1.35; margin-bottom:6px; }
  .card-sub { font-size:13px; font-weight:400; color:#888; margin-bottom:36px; }
  .card-sub span { display:block; margin-top:2px; font-style:italic; color:#aaa; }
  .lang-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lang-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px 12px; border:1.5px solid #e8e2da; border-radius:10px; background:#fff; color:var(--bu-navy); text-decoration:none; cursor:pointer; transition:all 0.18s ease; font-family:inherit; }
  .lang-btn:hover { border-color:var(--bu-accent); background:var(--bu-warm); transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,60,84,0.12); }
  .lang-btn:active { transform:translateY(0); }
  .lang-code { font-size:11px; font-weight:600; letter-spacing:0.16em; color:var(--bu-accent); text-transform:uppercase; margin-bottom:6px; }
  .lang-name { font-size:16px; font-weight:500; color:var(--bu-navy); }
  .lang-note { font-size:10.5px; font-weight:400; color:#999; margin-top:4px; }
  .footer { margin-top:32px; font-size:10px; color:#b8b8b8; letter-spacing:0.06em; }
  @media (max-width: 520px) { .card { padding:40px 28px 36px; } .card-title { font-size:18px; } .lang-buttons { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="card" role="dialog" aria-labelledby="pickerTitle">
    <img class="card-logo" src="bainultra-wordmark-dark.svg" alt="BainUltra">
    <div class="card-eyebrow">2026 Condensed Price List</div>
    <div class="card-title" id="pickerTitle">choose your language</div>
    <div class="card-sub"><span>choisissez votre langue</span></div>
    <div class="lang-buttons">
      <a class="lang-btn" href="en/" data-lang="en" aria-label="Continue in English">
        <span class="lang-code">EN</span>
        <span class="lang-name">English</span>
        <span class="lang-note">223 pages</span>
      </a>
      <a class="lang-btn" href="fr/" data-lang="fr" aria-label="Continuer en français">
        <span class="lang-code">FR</span>
        <span class="lang-name">Français</span>
        <span class="lang-note">223 pages</span>
      </a>
    </div>
    <div class="footer">BainUltra · Lévis, Québec · effective January 1, 2026</div>
  </div>
<script>
  (function(){
    var params=new URLSearchParams(window.location.search);
    var auto=params.get('auto')==='1';
    if (auto) {
      var pref=localStorage.getItem('bu_lang_pref');
      if (pref==='en'||pref==='fr') { window.location.replace(pref+'/'); return; }
    }
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.addEventListener('click', function(){
        try { localStorage.setItem('bu_lang_pref', b.dataset.lang); } catch(e) {}
      });
    });
    document.addEventListener('keydown', function(e){
      if (e.key==='e'||e.key==='E'||e.key==='1') window.location.href='en/';
      if (e.key==='f'||e.key==='F'||e.key==='2') window.location.href='fr/';
    });
  })();
</script>
</body>
</html>
